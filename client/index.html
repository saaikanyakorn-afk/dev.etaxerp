    <script>
      window.addEventListener("unhandledrejection", function(e) {
        if (!(e.reason instanceof Error)) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener("error", function(e) {
        if (e.message && e.message.indexOf("ResizeObserver") !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>

  </head>
  <body>
    <div id="root">
      <style id="initial-loader-style">
        #initial-loader {
          position: fixed; inset: 0; z-index: 99999;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: #fff;
          font-family: 'Sarabun', 'Inter', sans-serif;
        }
        #initial-loader .spinner {
          width: 44px; height: 44px;
          border: 4px solid #f3e8e4;
          border-top-color: #fb9678;
          border-radius: 50%;
          animation: il-spin 0.7s linear infinite;
        }
        #initial-loader .text {
          margin-top: 16px;
          color: #9e9e9e;
          font-size: 14px;
          letter-spacing: 0.3px;
        }
        @keyframes il-spin { to { transform: rotate(360deg); } }
      </style>
      <div id="initial-loader">
        <div class="spinner"></div>
        <div class="text">กำลังโหลด...</div>
      </div>
    </div>
    <script>
      window.__removeInitialLoader = function() {
        var el = document.getElementById('initial-loader');
        var st = document.getElementById('initial-loader-style');
        if (el) { el.style.opacity = '0'; el.style.transition = 'opacity 0.25s'; setTimeout(function() { el.remove(); if (st) st.remove(); }, 300); }
      };
    </script>
    <script src="https://www.google.com/recaptcha/api.js?render=explicit" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'activated') {
                    window.location.reload();
                  }
                });
              }
            });
          });
        });
      }
    </script>
  </body>
